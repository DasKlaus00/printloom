; |------------------------------------SLOT-OPERATION-------------------------------------|
[gcode_macro _DO_SLOT_OPERATION]
variable_global_x_unclamp: 0
variable_global_y_engage: 0
variable_global_first_z_flat: 0
variable_global_slot_gap: 0
variable_global_y_pullback_limit: 0
description: Helper macro to perform slot operations
gcode:
    {% set slot_number = params.SLOT_NUMBER|int %}
    {% set operation_macro = params.OPERATION_MACRO|string %} ; '_GRAB_FROM_SLOT' or '_STORE_TO_SLOT'
    {% set x_unclamp_offset = params.X_UNCLAMP_OFFSET|int %}
    {% set z_flat_offset = params.Z_FLAT_OFFSET|int %}
    
    {% set x_unclamp = printer["gcode_macro _GLOBAL_VARS"].global_x_unclamp + x_unclamp_offset %}
    {% set y_engage = printer["gcode_macro _GLOBAL_VARS"].global_y_engage %}
    {% set slot_gap = printer["gcode_macro _GLOBAL_VARS"].global_slot_gap + 30 %}
    {% set z_flat = printer["gcode_macro _GLOBAL_VARS"].global_first_z_flat + ((slot_number-1)*slot_gap) + z_flat_offset %}
    {% set y_pullback_limit = printer["gcode_macro _GLOBAL_VARS"].global_y_pullback_limit %}

    M117 Performing slot operation for Slot {slot_number}...

    ; Set variables for the target macro (_GRAB_FROM_SLOT or _STORE_TO_SLOT)
    SET_GCODE_VARIABLE MACRO={operation_macro} VARIABLE=otto_x_unclamp VALUE={x_unclamp}
    SET_GCODE_VARIABLE MACRO={operation_macro} VARIABLE=otto_y_engage VALUE={y_engage}
    SET_GCODE_VARIABLE MACRO={operation_macro} VARIABLE=otto_z_flat VALUE={z_flat}
    SET_GCODE_VARIABLE MACRO={operation_macro} VARIABLE=otto_y_pullback_limit VALUE={y_pullback_limit}
    ; Execute the target macro
    {operation_macro}
    M400


