; |------------------------------------STORAGE CALIBRATION CONFIG FILE-------------------------------------|
; |------------------------------------VERSION: 1.0 RELEASE 10/04/2026-------------------------------------|

[gcode_macro _GLOBAL_VARS]
variable_global_x_unclamp: 31 ; LOCATION FOR UNCLAMP 'X' OF THE PLATE BRACKET
variable_global_y_engage: 318 ; LOCATION FOR DEPTH OF 'Y' WHERE THE BUILD PLATE CAN BE SLID INTO THE FORK
variable_global_first_z_flat: 11 ; LOCATION FOR HEIGHT OF 'Z' WHERE THE BUILD PLATE IS LEVEL TO THE FORK
variable_global_slot_gap: 25 ; GAP ( in mm ) BETWEEN THE STORAGE RACK BRACKETS
variable_global_y_pullback_limit: 10 ; DEFAULT IS 10 FOR 256x256 BUILD PLATES. AND IT IS 30 FOR THE SMALLER PLATE 220x220
gcode: ;

; |------------------------------------SLOT-1-------------------------------------|
[gcode_macro GRAB_FROM_SLOT_1]
description: Taking new plate to deliver to printer from Slot 1
gcode:
    {% set x_unclamp_offset = 0 %}
    {% set z_flat_offset = 0 %}
    
    M117 Grabbing bed from slot 1...
    _DO_SLOT_OPERATION SLOT_NUMBER=1 OPERATION_MACRO=_GRAB_FROM_SLOT X_UNCLAMP_OFFSET={x_unclamp_offset} Z_FLAT_OFFSET={z_flat_offset}

[gcode_macro STORE_TO_SLOT_1]
description: Start STORE PRINT Macro for Slot 1
gcode:
    {% set x_unclamp_offset = 0 %}
    {% set z_flat_offset = 0 %}
    
    M117 Storing to slot 1...
    _DO_SLOT_OPERATION SLOT_NUMBER=1 OPERATION_MACRO=_STORE_TO_SLOT X_UNCLAMP_OFFSET={x_unclamp_offset} Z_FLAT_OFFSET={z_flat_offset}

