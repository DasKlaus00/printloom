[gcode_macro CLOSE_DOOR_BAMBU_X_ONE_C]
description: 'Closing BAMBU X1C Door'
gcode:
    # DOOR CLOSING VARIABLES
    {% set x_start = 103 %}
    {% set y_start = 322 %}
    {% set z_engage = 105 %}
    {% set d_to_pin_dist = 375 %} ; distance from pivot point of the door to center of the arm pin

    SET_GCODE_VARIABLE MACRO=_CLOSE_DOOR VARIABLE=door_x_start VALUE={x_start}
    SET_GCODE_VARIABLE MACRO=_CLOSE_DOOR VARIABLE=door_y_start VALUE={y_start}
    SET_GCODE_VARIABLE MACRO=_CLOSE_DOOR VARIABLE=door_z_engage VALUE={z_engage}
    SET_GCODE_VARIABLE MACRO=_CLOSE_DOOR VARIABLE=door_d_to_pin_dist VALUE={d_to_pin_dist}

    M117 'Closing BAMBU X1C Door'
    _CLOSE_DOOR
    M117 'Closed Door'

