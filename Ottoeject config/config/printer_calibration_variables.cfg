; |------------------------------------PRINTER: BAMBU LAB X1C-------------------------------------|
[gcode_macro EJECT_FROM_BAMBULAB_X_ONE_C]
description: 'Eject build plate from Bambulab X1C (without homing)'
gcode:
    {% set x_unclamp = 442 %}
    {% set y_engage = 319 %}
    {% set z_flat = 21 %}
    M117 'Removing build plate from Bambulab X1C...'
    OPEN_DOOR_BAMBU_X_ONE_C
    SET_GCODE_VARIABLE MACRO=_EJECT_FROM_PRINTER VARIABLE=otto_x_unclamp VALUE={x_unclamp}
    SET_GCODE_VARIABLE MACRO=_EJECT_FROM_PRINTER VARIABLE=otto_y_engage VALUE={y_engage}
    SET_GCODE_VARIABLE MACRO=_EJECT_FROM_PRINTER VARIABLE=otto_z_flat VALUE={z_flat}
    _EJECT_FROM_PRINTER
    M400

;   -- LOAD BUILD PLATE ONTO Bambulab X1C
[gcode_macro LOAD_ONTO_BAMBULAB_X_ONE_C]
description: 'Load a build plate onto Bambulab X1C'
gcode:
    {% set x_unclamp = 425 %}
    {% set y_engage = 340 %}
    {% set z_flat = 17.5 %}

    ; MOVE BUILD PLATE TO PRINTER
    M117 'Moving build plate to Printer: Bambulab X1C'
    SET_GCODE_VARIABLE MACRO=_LOAD_ONTO_PRINTER VARIABLE=otto_x_unclamp VALUE={x_unclamp}
    SET_GCODE_VARIABLE MACRO=_LOAD_ONTO_PRINTER VARIABLE=otto_y_engage VALUE={y_engage}
    SET_GCODE_VARIABLE MACRO=_LOAD_ONTO_PRINTER VARIABLE=otto_z_flat VALUE={z_flat}
    _LOAD_ONTO_PRINTER
    M400
    M117 'Build plate loaded onto Bambulab X1C'
    CLOSE_DOOR_BAMBU_X_ONE_C
    M117 'Loading build plate process onto Bambulab X1C Completed'

