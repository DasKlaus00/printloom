<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Printloom" />
    <title>Printloom — 3D Print Farm Controller</title>
    <script>
      /* Thema VOR dem ersten Bild setzen — sonst blitzt kurz die falsche Farbe auf.
         Gleiche Logik wie services/theme.js (getTheme/resolveTheme): ausdrückliche
         Wahl, sonst altes dunkles Thema, sonst dem System folgen. */
      (function () {
        var t = null, alt = null
        try { t = localStorage.getItem('printloom_theme_choice'); alt = localStorage.getItem('printloom_theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark' && t !== 'auto') {
          t = (alt === 'dark' || alt === 'slate' || alt === 'midnight') ? 'dark' : 'auto'
        }
        if (t === 'auto') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
