name: Tests

on:
  push:
    branches: [ main, beta ]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest
        run: cd backend && python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: cd frontend && npm install --no-audit --no-fund
      # Faengt Abstuerze ab, die kein Test sieht: eine vergessene Variable
      # (no-undef) reisst beim Rendern die ganze Seite runter. Bewusst nur die
      # Absturz-Regeln - Stil-Meckern wuerde den Waechter unbrauchbar machen.
      - name: Run lint (Absturz-Regeln)
        run: cd frontend && npm run lint:ci
      - name: Run vitest
        run: cd frontend && npm test
