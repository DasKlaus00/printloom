name: Build & Publish Docker Image

on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  # Promote (promote.yml) stößt hierüber das Native-Paket für main an: Pushes mit
  # dem Actions-Token starten keine Workflows, ein workflow_dispatch schon.
  workflow_dispatch:
    inputs:
      native_only:
        description: "Nur das Native-Paket bauen (kein Image)"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Erst testen, dann bauen. Vorher liefen beide Workflows unabhängig: bei v1.1.26
  # waren die Tests rot, das Image wurde trotzdem gebaut und stand zum Update bereit.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU für den arm64-Teil des Multi-Arch-Builds (Raspberry Pi).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Die App zeigt im Update-Dialog „v1.1.39 verfügbar" statt eines Digests —
      # dafür steht die Version als Label im Image. metadata-action setzt dasselbe
      # Label auf den Branch-Namen („beta"); das eigene steht deshalb unten ZULETZT.
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < backend/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Multi-Arch: amd64 (Proxmox/PC) + arm64 (Raspberry Pi 3/4/5, 64-bit OS).
          # Ein Tag enthält beide — jeder Host zieht automatisch seine Architektur.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Natives (Docker-loses) Installieren: fertiges Frontend als rollierendes
  #    Release-Asset. Schwache Geräte (Raspberry Pi Zero 2 W, 512 MB) können den
  #    Vite-Build nicht selbst ausführen — install-native.sh/update-native.sh
  #    laden stattdessen dieses Tarball (Tag native-latest bzw. native-beta). ──
  native-dist:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Pack dist
        run: tar czf printloom-frontend-dist.tar.gz -C frontend dist

      - name: Publish rolling native release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-${{ github.ref_name == 'main' && 'latest' || 'beta' }}
          name: Native install assets (${{ github.ref_name == 'main' && 'latest' || 'beta' }})
          prerelease: ${{ github.ref_name != 'main' }}
          make_latest: false
          body: |
            Rolling asset for the native (no-Docker) installation — updated on every ${{ github.ref_name }} push.
            Not meant for manual download; used by `scripts/install-native.sh` / `scripts/update-native.sh`.
          files: printloom-frontend-dist.tar.gz
