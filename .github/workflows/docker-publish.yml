name: Build & Publish Docker Image

on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  # Promote (promote.yml) stößt hierüber das Native-Paket für main an: Pushes mit
  # dem Actions-Token starten keine Workflows, ein workflow_dispatch schon.
  workflow_dispatch:
    inputs:
      native_only:
        description: "Nur das Native-Paket bauen (kein Image)"
        type: boolean
        default: false

# Fremde Actions sind auf einen Commit festgelegt (Tag als Kommentar): Ein Tag wie
# @v3 kann der Herausgeber jederzeit auf anderen Code umhängen, und dieser Code
# bekäme hier das Schreibrecht für Images und Releases. Neue Version: SHA per
# `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>^{}` holen.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Erst testen, dann bauen. Vorher liefen beide Workflows unabhängig: bei v1.1.26
  # waren die Tests rot, das Image wurde trotzdem gebaut und stand zum Update bereit.
  tests:
    uses: ./.github/workflows/tests.yml

  build-and-push:
    needs: tests
    if: ${{ !inputs.native_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # QEMU für den arm64-Teil des Multi-Arch-Builds (Raspberry Pi).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Die App zeigt im Update-Dialog „v1.1.39 verfügbar" statt eines Digests —
      # dafür steht die Version als Label im Image. metadata-action setzt dasselbe
      # Label auf den Branch-Namen („beta"); das eigene steht deshalb unten ZULETZT.
      - name: Read version
        id: version
        run: echo "version=$(tr -d '[:space:]' < backend/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Kein :latest mehr aus einem Push auf main (bis v1.1.74): :latest setzt nur
          # Promote, und zwar auf das auf der Farm GETESTETE Beta-Image.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          # Multi-Arch: amd64 (Proxmox/PC) + arm64 (Raspberry Pi 3/4/5, 64-bit OS).
          # Ein Tag enthält beide — jeder Host zieht automatisch seine Architektur.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Natives (Docker-loses) Installieren: fertiges Frontend als rollierendes
  #    Release-Asset. Schwache Geräte (Raspberry Pi Zero 2 W, 512 MB) können den
  #    Vite-Build nicht selbst ausführen — install-native.sh/update-native.sh
  #    laden stattdessen dieses Tarball (Tag native-latest bzw. native-beta). ──
  native-dist:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # Mit Prüfsumme: install-native.sh/update-native.sh entpacken nur, was dazu passt.
      - name: Pack dist
        run: |
          tar czf printloom-frontend-dist.tar.gz -C frontend dist
          sha256sum printloom-frontend-dist.tar.gz > printloom-frontend-dist.tar.gz.sha256

      # Erst das Paket, ZULETZT die Prüfsumme — jede Datei mit Wiederholungen. Scheitert
      # ein Upload, bleibt das alte, zusammenpassende Paar stehen. Bis v1.1.83 lud eine
      # Fremd-Action beide Dateien; brach das Paket ab (v1.1.75, v1.1.83), lag eine neue
      # Prüfsumme neben dem alten Paket, und update-native.sh lehnte jedes Update ab.
      # `gh` liegt auf den GitHub-Runnern bereit, eine Fremd-Action ist nicht mehr nötig.
      - name: Publish rolling native release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.ref_name == 'main' && 'latest' || 'beta' }}
        run: |
          set -euo pipefail
          TAG="native-$CHANNEL"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            flags=(--latest=false)
            if [ "$CHANNEL" = beta ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" --title "Native install assets ($CHANNEL)" \
              --notes "Rolling asset for the native (no-Docker) installation, updated on every $GITHUB_REF_NAME push. Not meant for manual download; used by scripts/install-native.sh and scripts/update-native.sh."
          fi
          upload() {
            for i in 1 2 3 4 5; do
              if gh release upload "$TAG" "$1" --clobber; then return 0; fi
              echo "Upload von $1 fehlgeschlagen (Versuch $i), neuer Versuch in $((i * 10)) s"
              sleep $((i * 10))
            done
            return 1
          }
          upload printloom-frontend-dist.tar.gz
          upload printloom-frontend-dist.tar.gz.sha256
