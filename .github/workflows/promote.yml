name: Promote (Beta → Stabil)

# Bringt einen auf der Farm getesteten Beta-Stand in den stabilen Kanal:
#   1. Tag vX.Y.Z auf den beta-Commit, main auf beta vorspulen
#   2. das GETESTETE Beta-Image als :latest, :X.Y.Z und :X.Y umtaggen — nicht neu
#      bauen. Ein Neubau aus main wäre zwar derselbe Code, aber nicht dasselbe Image
#      (Basis-Image und Pakete können sich inzwischen geändert haben).
#   3. das Native-Paket (native-latest) für main bauen lassen
#
# Bis v1.1.38 lief das von Hand: git tag + git push printloom beta:main, und der
# Push auf main baute :latest noch einmal neu.
#
# Start: GitHub → Actions → „Promote (Beta → Stabil)" → Run workflow → Version und
# Digest. Den Digest zeigt die System-Seite der getesteten Farm („Installiertes
# Image: sha256:…"). So wird genau das Image stabil, das dort lief — nicht ein
# späterer Build, der zufällig dieselbe Version trägt (seit v1.1.75).
#
# Reihenfolge: erst prüfen, dann umtaggen, ZULETZT Tag und main. Scheitert das
# Umtaggen, bleiben Tag und main unberührt (bis v1.1.74 umgekehrt).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Getestete Version, die auf beta steht (z. B. 1.1.40)"
        required: true
      digest:
        description: "Digest des getesteten Images (System-Seite: sha256:…, mind. 12 Zeichen)"
        required: true

permissions:
  contents: write   # Tag + main
  packages: write   # Image umtaggen
  actions: write    # Native-Paket anstoßen

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Prüfen (Version, Tag, Vorspulen möglich)
        id: check
        env:
          WANTED: ${{ inputs.version }}
          WANTED_DIGEST: ${{ inputs.digest }}
        run: |
          set -euo pipefail
          VERSION="${WANTED#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Keine gültige Version: $WANTED"; exit 1
          fi
          DIGEST="$(echo "${WANTED_DIGEST#sha256:}" | tr 'A-F' 'a-f' | tr -d '[:space:]')"
          if ! echo "$DIGEST" | grep -Eq '^[0-9a-f]{12,64}$'; then
            echo "::error::Kein gültiger Digest: $WANTED_DIGEST (sha256: und mind. 12 Hex-Zeichen)"; exit 1
          fi
          ON_BETA="$(tr -d '[:space:]' < backend/version.txt)"
          if [ "$ON_BETA" != "$VERSION" ]; then
            echo "::error::beta steht auf $ON_BETA, nicht auf $VERSION"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION gibt es schon"; exit 1
          fi
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "::error::main hat Commits, die nicht in beta sind — Vorspulen unmöglich"; exit 1
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA="$(git rev-parse HEAD)"
          {
            echo "version=$VERSION"
            echo "digest=$DIGEST"
            echo "minor=${VERSION%.*}"
            echo "image=$IMAGE"
            echo "source=$IMAGE:sha-${SHA:0:7}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Vor jedem Schreiben: Gibt es das Image zu genau diesem Commit, und ist es das
      # getestete? Fehlt es (Build rot oder nicht fertig) oder passt der Digest nicht,
      # wird nichts getaggt und nichts vorgespult.
      - name: Getestetes Beta-Image vorhanden und gleich?
        env:
          SOURCE: ${{ steps.check.outputs.source }}
          WANT: ${{ steps.check.outputs.digest }}
        run: |
          set -euo pipefail
          OUT="$(docker buildx imagetools inspect "$SOURCE")"
          echo "$OUT"
          ACTUAL="$(echo "$OUT" | awk '/^Digest:/{print $2; exit}')"
          ACTUAL="${ACTUAL#sha256:}"
          if [ -z "$ACTUAL" ]; then
            echo "::error::Digest von $SOURCE nicht lesbar"; exit 1
          fi
          case "$ACTUAL" in
            "$WANT"*) echo "Digest passt: sha256:$ACTUAL" ;;
            *) echo "::error::$SOURCE hat sha256:$ACTUAL — getestet wurde sha256:$WANT…"; exit 1 ;;
          esac

      - name: Image umtaggen
        run: |
          IMG="${{ steps.check.outputs.image }}"
          docker buildx imagetools create \
            -t "$IMG:latest" -t "$IMG:main" \
            -t "$IMG:${{ steps.check.outputs.version }}" -t "$IMG:${{ steps.check.outputs.minor }}" \
            "${{ steps.check.outputs.source }}"

      - name: Tag setzen und main vorspulen
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.check.outputs.version }}" -m "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
          git push origin HEAD:main

      - name: Native-Paket für Stabil anstoßen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docker-publish.yml --ref main -f native_only=true
